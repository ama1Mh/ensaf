<div class="scr" id="profile">
  <div class="profile-card">
    <div class="profile-head">
      <div>
        <div class="profile-title" data-i18n="authProfileTitle">الملف الشخصي</div>
        <div id="profile-welcome" class="profile-welcome"></div>
      </div>
    </div>

    <div class="profile-info">
      <div class="profile-row"><span data-i18n="authProfileEmail">البريد الإلكتروني</span><span id="profile-email"></span></div>
      <div class="profile-row"><span data-i18n="authProfileModeLabel">طريقة التفاعل</span>
        <select id="profile-mode" class="auth-input">
          <option value="head" data-i18n="modeHeadOption">تتبع الرأس (أسرع)</option>
          <option value="eye" data-i18n="modeEyeOption">تتبع العين (أدق)</option>
          <option value="mouse" data-i18n="modeMouseOption">الماوس (بديل)</option>
        </select>
      </div>
      <div class="profile-row"><span data-i18n="authProfileThemeLabel">الثيم</span>
        <select id="profile-theme" class="auth-input">
          <option value="default" data-i18n="themeLight">الوضع الافتراضي</option>
          <option value="warm" data-i18n="themeDark">الوضع الداكن</option>
        </select>
      </div>
      <div class="profile-row"><span data-i18n="authProfileLangLabel">اللغة</span>
        <select id="profile-language" class="auth-input">
          <option value="ar">العربية</option>
          <option value="en">English</option>
          <option value="zh">中文</option>
        </select>
      </div>
    </div>

    <div class="profile-actions">
      <button id="profile-save-btn" class="cta" data-i18n="authProfileSave">حفظ التفضيلات</button>
      <button id="profile-signout-btn" class="bhome" data-i18n="authProfileSignOut">تسجيل الخروج</button>
    </div>
  </div>
</div>
