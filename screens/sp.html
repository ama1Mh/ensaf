<div class="scr" id="sp">
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;z-index:2;">
    <div class="pico">📷</div>
    <div class="ptit" data-i18n="permissionTitle">Camera permission required</div>
    <div class="pdesc" data-i18n="permissionDesc">
      Tracking uses the camera to follow your head or eye movement. No video is stored.
    </div>
    <div class="psteps">
      <div class="pstep"><div class="psn">1</div><span data-i18n="permissionStep1">Click "Allow" in the browser permission window</span></div>
      <div class="pstep"><div class="psn">2</div><span data-i18n="permissionStep2">Good lighting — your face should be clearly visible</span></div>
      <div class="pstep"><div class="psn">3</div><span data-i18n="permissionStep3">Sit 50–70 cm from the screen</span></div>
      <div class="pstep"><div class="psn">4</div><span data-i18n="permissionStep4">Move your head or eyes to steer the cursor</span></div>
    </div>
    <button class="cta" onclick="App.requestCamera()" data-i18n="permissionAllow">Allow camera</button>
    <button class="bout" onclick="App.useMouse()" data-i18n="permissionUseMouse">Use mouse instead</button>
  </div>
</div>
