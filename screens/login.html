<div class="scr" id="login">
  <div class="auth-card">
    <div class="auth-header">
      <div>
        <div class="wlogo">ENSAF</div>
        <div class="auth-sub" data-i18n="authLoginDescription">Sign in to preserve your progress and personalized settings.</div>
      </div>
    </div>

    <div class="auth-tabs">
      <button id="auth-tab-login" class="auth-tab act" data-i18n="authTabLogin">Login</button>
      <button id="auth-tab-register" class="auth-tab" data-i18n="authTabRegister">Sign Up</button>
    </div>

    <div id="auth-status" class="auth-status"></div>

    <form id="auth-login-form" class="auth-form">
      <label class="auth-label" for="login-email" data-i18n="authEmail">Email</label>
      <input id="login-email" class="auth-input" type="email" autocomplete="username" placeholder="name@example.com" />
      <label class="auth-label" for="login-password" data-i18n="authPassword">Password</label>
      <input id="login-password" class="auth-input" type="password" autocomplete="current-password" placeholder="••••••••" />
      <button class="cta" type="submit" data-i18n="authSubmitLogin">Sign In</button>
      <button id="auth-forgot-btn" type="button" class="link-button" data-i18n="authForgotPassword">Forgot password?</button>
    </form>

    <form id="auth-register-form" class="auth-form hidden">
      <label class="auth-label" for="register-name" data-i18n="authName">Name</label>
      <input id="register-name" class="auth-input" type="text" placeholder="Your name" />
      <label class="auth-label" for="register-email" data-i18n="authEmail">Email</label>
      <input id="register-email" class="auth-input" type="email" autocomplete="email" placeholder="name@example.com" />
      <label class="auth-label" for="register-password" data-i18n="authPassword">Password</label>
      <input id="register-password" class="auth-input" type="password" autocomplete="new-password" placeholder="••••••••" />
      <label class="auth-label" for="register-confirm" data-i18n="authConfirmPassword">Confirm Password</label>
      <input id="register-confirm" class="auth-input" type="password" autocomplete="new-password" placeholder="••••••••" />
      <button class="cta" type="submit" data-i18n="authSubmitRegister">Create Account</button>
    </form>

    <div class="auth-footer">
      <button id="auth-guest-btn" class="cta secondary" type="button" data-i18n="authGuestContinue">Continue as guest</button>
    </div>
  </div>
</div>
